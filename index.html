<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Запрошення на Ювілей 🥂✨</title>
  <meta name="description" content="3D-подорож запрошення на ювілей: 17 листопада 2026 року, ресторан «Австрійський двір»">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Audio Element -->
  <audio id="bgMusic" loop preload="auto">
    <source src="assets/music.mp3" type="audio/mpeg">
  </audio>

  <!-- 3D Canvas across the entire screen -->
  <canvas id="webgl-canvas"></canvas>

  <!-- ========================================================================
       1. FIRST VIEW: NEAT 3D ENVELOPE / CARD AT SCREEN CENTER
       ======================================================================== -->
  <div id="envelope-stage">
    <!-- Ambient Sparkles -->
    <div class="env-bg-sparkles">
      <div class="env-sparkle-dot" style="top:15%;left:22%;width:8px;height:8px;animation-delay:0s;"></div>
      <div class="env-sparkle-dot" style="top:25%;left:75%;width:12px;height:12px;animation-delay:0.8s;"></div>
      <div class="env-sparkle-dot" style="top:68%;left:82%;width:6px;height:6px;animation-delay:1.5s;"></div>
      <div class="env-sparkle-dot" style="top:75%;left:18%;width:10px;height:10px;animation-delay:2.1s;"></div>
      <div class="env-sparkle-dot" style="top:40%;left:88%;width:7px;height:7px;animation-delay:1.1s;"></div>
    </div>

    <!-- 3D Envelope Container with Pocket, Flap, Seal and Sliding Card -->
    <div class="envelope-3d-wrap">
      <div class="envelope-box">
        <!-- Top Folding Flap -->
        <div class="envelope-flap"></div>

        <!-- Wax Seal -->
        <div class="wax-seal">
          <img src="assets/seal.svg" alt="Печатка">
        </div>

        <!-- Inside Card (tucked inside) -->
        <div class="envelope-card">
          <span class="card-subtitle">Особливе запрошення</span>
          <div class="card-decor-line"></div>
          <h1 class="card-title">Мій Ювілей</h1>
          <p class="card-date">17 листопада 2026 • 16:00</p>
        </div>
      </div>
    </div>

    <!-- Animated Hint -->
    <div class="env-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M19 12l-7 7-7-7"/>
      </svg>
      <span>Натисніть або потягніть, щоб відкрити</span>
    </div>
  </div>

  <!-- ========================================================================
       HUD & PROGRESS TRACK RAIL
       ======================================================================== -->
  <header class="hud-nav">
    <div class="hud-brand">Ювілей 2026</div>
    <div class="hud-scroll-hint">
      <span class="dot"></span>
      <span>Гортайте, щоб їхати по 3D-дорозі</span>
    </div>
  </header>

  <!-- Side Navigation Rail -->
  <aside class="track-rail">
    <div class="track-line">
      <div class="track-fill"></div>
      <div class="track-ball"></div>
    </div>
    <div class="track-stations">
      <span class="track-station-item active" onclick="jumpToStation(0.02)">Старт</span>
      <span class="track-station-item" onclick="jumpToStation(0.20)">Привітання</span>
      <span class="track-station-item" onclick="jumpToStation(0.40)">Календар</span>
      <span class="track-station-item" onclick="jumpToStation(0.60)">Ресторан</span>
      <span class="track-station-item" onclick="jumpToStation(0.80)">Програма</span>
      <span class="track-station-item" onclick="jumpToStation(0.94)">Зустріч</span>
    </div>
  </aside>

  <!-- Virtual scroll controller providing 900vh scrollable height -->
  <div id="scroll-container"></div>

  <!-- Floating Audio Control -->
  <div class="music-toggle" id="musicToggle" title="Увімкнути / вимкнути музику">
    <svg id="musicIconOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
      <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
    </svg>
    <svg id="musicIconOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      <line x1="2" y1="2" x2="22" y2="22" stroke-width="2.5"/>
    </svg>
  </div>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- World & Application Scripts -->
  <script src="js/world.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
